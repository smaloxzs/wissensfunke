<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wissensfunke</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Jeden Tag eine kurze Lektion Allgemeinwissen mit Quiz und Wiederholung.">
<meta name="theme-color" content="#E3832A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: mobile-first app shell, one reading column (max 720px), bottom tab bar on phones, top bar on desktop.
   Each category carries a hue (--h); tints and strong tones derive from theme-aware lightness tokens. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#ECEEF5; --fg:#161928; --muted:#5A6079; --line:#DCE0EB;
  --accent:#E3832A; --accent-ink:#2A1606; --accent-soft:#FCE9D6;
  --good:#1D8657; --good-soft:#DDF3E8; --bad:#C2413A; --bad-soft:#F9E0DE;
  --tint-l:93%; --tint-s:70%; --strong-l:38%; --strong-s:62%;
  --shadow:0 1px 2px rgba(22,25,40,.06),0 6px 24px rgba(22,25,40,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F111A; --surface:#181B28; --surface-2:#212536; --fg:#ECEEF6; --muted:#9BA1BA; --line:#2B3045;
  --accent:#F2A04D; --accent-ink:#1E1003; --accent-soft:#3A2814;
  --good:#4CC48A; --good-soft:#163328; --bad:#F0776F; --bad-soft:#3A1C1B;
  --tint-l:20%; --tint-s:35%; --strong-l:72%; --strong-s:70%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F111A; --surface:#181B28; --surface-2:#212536; --fg:#ECEEF6; --muted:#9BA1BA; --line:#2B3045;
  --accent:#F2A04D; --accent-ink:#1E1003; --accent-soft:#3A2814;
  --good:#4CC48A; --good-soft:#163328; --bad:#F0776F; --bad-soft:#3A1C1B;
  --tint-l:20%; --tint-s:35%; --strong-l:72%; --strong-s:70%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
p{margin:0}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px}
.cat{--c:hsl(var(--h) var(--strong-s) var(--strong-l));--t:hsl(var(--h) var(--tint-s) var(--tint-l))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;text-decoration:none}
.brand svg{width:24px;height:24px}
.top-stats{margin-left:auto;display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:15px;height:15px}
.pill.fire{color:var(--accent)}
.desk-nav{display:none;gap:2px;margin-left:18px}
.desk-nav a{padding:6px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500}
.desk-nav a.on{color:var(--fg);background:var(--surface-2)}
@media (min-width:860px){.desk-nav{display:flex}.tabbar{display:none!important}.wrap{padding-bottom:60px}}

/* bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;position:relative}
.tabbar a svg{width:22px;height:22px}
.tabbar a.on{color:var(--accent)}
.badge{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* generic */
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 18px;font-weight:600;text-decoration:none;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:10px}
.section-h h2{font-size:20px}
.input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none}
.input:focus{border-color:var(--accent)}
textarea.input{resize:vertical;min-height:80px}

/* home */
.hello h1{font-size:clamp(26px,6vw,34px);letter-spacing:-.02em}
.hello p{color:var(--muted);margin-top:4px}
.hero-lesson{position:relative;overflow:hidden;border-radius:20px;padding:22px;background:var(--t);border:1px solid color-mix(in srgb,var(--c) 25%,transparent);display:flex;flex-direction:column;gap:12px}
.hero-lesson .glyph{position:absolute;right:-18px;top:-18px;width:150px;height:150px;color:var(--c);opacity:.18}
.hero-lesson h2{font-size:clamp(24px,5.5vw,30px);max-width:85%}
.hero-lesson .hook{font-family:var(--f-read);font-size:16px;max-width:60ch}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.07em}
.tag svg{width:16px;height:16px}
.goal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal .card{padding:14px;display:flex;flex-direction:column;gap:8px}
.meter{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .4s}
.meter.cat i{background:var(--c)}
.big-num{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.fact{border-left:3px solid var(--accent);padding:4px 0 4px 14px;font-family:var(--f-read);font-size:15.5px}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.quick button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;font-weight:600}
.quick button svg{width:22px;height:22px;color:var(--accent)}
.quick button span{font-weight:400;font-size:13px;color:var(--muted)}

/* categories */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.cat-tile{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;text-decoration:none;min-width:0}
.cat-tile .ic{width:38px;height:38px;border-radius:10px;background:var(--t);color:var(--c);display:flex;align-items:center;justify-content:center}
.cat-tile .ic svg{width:22px;height:22px}
.cat-tile b{font-family:var(--f-display);font-size:16px}
.lesson-list{display:flex;flex-direction:column;gap:8px}
.lesson-row{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);text-decoration:none;text-align:left;width:100%}
.lesson-row .num{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--t);color:var(--c);font-weight:700;font-size:14px}
.lesson-row.done .num{background:var(--c);color:var(--surface)}
.lesson-row .num svg{width:18px;height:18px}
.lesson-row .tx{min-width:0;flex:1}
.lesson-row .tx b{display:block;font-weight:600}
.lesson-row .tx span{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-mark{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);letter-spacing:.05em;margin-left:6px;vertical-align:2px}
.cat-head{display:flex;gap:14px;align-items:center}
.cat-head .ic{width:54px;height:54px;border-radius:14px;background:var(--t);color:var(--c);display:flex;align-items:center;justify-content:center;flex:none}
.cat-head .ic svg{width:30px;height:30px}

/* lesson player */
.player{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:calc(100vh - 140px)}
.player-top{display:flex;align-items:center;gap:12px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.progress{flex:1;height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--c,var(--accent));transition:width .3s}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,30px);display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);animation:rise .28s ease}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}.meter i,.progress i{transition:none}}
.slide h2{font-size:clamp(22px,5vw,28px);letter-spacing:-.01em}
.reading{font-family:var(--f-read);font-size:17px;line-height:1.7;max-width:64ch;display:flex;flex-direction:column;gap:12px}
.reading strong{font-weight:600;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--c,var(--accent)) 28%,transparent) 62%)}
.merke{background:var(--t,var(--accent-soft));border-radius:12px;padding:12px 14px;font-size:15px;display:flex;gap:10px}
.merke b{color:var(--c,var(--accent));flex:none;font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding-top:2px}
.intro-meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.player-nav{display:flex;gap:10px;margin-top:auto;position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.player-nav .btn{flex:1;box-shadow:var(--shadow)}
.player-nav .btn.ghost{flex:none;background:var(--surface);border-color:var(--line)}

/* questions */
.q-type{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--c,var(--accent))}
.q-text{font-size:19px;font-weight:600;line-height:1.4;font-family:var(--f-ui)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;width:100%}
.opt:hover:not([disabled]){border-color:var(--c,var(--accent))}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
.opt.sel{border-color:var(--c,var(--accent));background:var(--t,var(--accent-soft))}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-weight:600;padding:16px}
.feedback{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback b{font-family:var(--f-display);font-size:17px}
.feedback.ok b{color:var(--good)}
.feedback.no b{color:var(--bad)}
.order-pool,.order-ans{display:flex;flex-direction:column;gap:6px}
.order-ans{min-height:52px;border:1.5px dashed var(--line);border-radius:12px;padding:6px}
.order-ans:empty::before{content:"Tippe die Einträge unten in der richtigen Reihenfolge an";color:var(--muted);font-size:13px;padding:10px}
.chip{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.chip .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--c,var(--accent));color:var(--surface);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.chip.right{border-color:var(--good);background:var(--good-soft)}
.chip.wrong{border-color:var(--bad);background:var(--bad-soft)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.match .chip{min-height:48px;font-size:14px}
.match .chip.sel{border-color:var(--c,var(--accent));background:var(--t,var(--accent-soft))}
.match .chip[data-pair]{border-width:2px}
.gap-row{display:flex;gap:8px}
.gap-row .input{flex:1;min-width:0}

/* summary */
.score-ring{width:120px;height:120px;margin:0 auto;position:relative}
.score-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:28px}
.score-ring div small{font-family:var(--f-ui);font-size:12px;font-weight:500;color:var(--muted)}
.recap{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.recap li{display:flex;gap:10px;font-size:15px}
.recap li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));margin-top:8px}
.links{display:flex;flex-direction:column;gap:6px}
.links a{display:flex;gap:8px;align-items:center;color:var(--c,var(--accent));font-weight:600;text-decoration:none}
.links a svg{width:16px;height:16px}

/* claude panel */
.ask{display:flex;flex-direction:column;gap:10px}
.ask-out{font-family:var(--f-read);font-size:15.5px;line-height:1.65;background:var(--surface-2);border-radius:12px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.ask-out:empty{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.drawer-bg{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.drawer{background:var(--surface);width:100%;max-width:680px;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.drawer-bg{align-items:center}.drawer{border-radius:20px}}

/* profile */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.stats .card{padding:14px}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface-2);max-width:100%}
.heat i.l1{background:color-mix(in srgb,var(--accent) 40%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 70%,var(--surface-2))}
.heat i.l3{background:var(--accent)}
.heat i.today{outline:2px solid var(--fg);outline-offset:1px}
.cat-prog{display:flex;flex-direction:column;gap:10px}
.cat-prog .r{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.cat-prog .r span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
@media (max-width:420px){.cat-prog .r{grid-template-columns:100px 1fr 40px}}
.tip{display:flex;flex-direction:column;gap:8px}
.tip h3{font-size:18px}
.tip .how{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.tip .how b{color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:600;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;font-size:14px;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:30px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty svg{width:48px;height:48px;color:var(--accent)}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.cloud i{background:var(--good)}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#heute" aria-label="Wissensfunke Startseite">
      <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z" fill="var(--accent)"/></svg>
      Wissensfunke
    </a>
    <nav class="desk-nav" id="deskNav"></nav>
    <div class="top-stats" id="topStats"></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<nav class="tabbar" id="tabbar"></nav>

<script>
window.WF = { lessons: [], add(l){ this.lessons.push(l); } };
</script>
<script src="content/c1.js"></script>
<script src="content/c2.js"></script>
<script src="content/c3.js"></script>
<script src="content/c4.js"></script>
<script src="content/c5.js"></script>
<script src="content/c6.js"></script>
<script src="app.js"></script>
</body>
</html>
